name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack & setup pnpm
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build workspaces
        run: pnpm build

      - name: Run verification gate (format, lint, typecheck, licenses, tests)
        env:
          TINYTLDR_REQUIRE_FIREBASE_EMULATORS: "1"
        run: pnpm dlx firebase-tools@15.34.2 emulators:exec --project demo-tinytldr --only auth,firestore "pnpm check"

  golden-linux:
    name: Golden Image Diffs (Pinned Linux Container)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack & setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Run golden image tests
        run: pnpm test:golden
